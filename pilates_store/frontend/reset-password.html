<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Choose a new password — Pilates equipment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- Opened from the password-reset link (POST /api/auth/forgot creates it) -->
  <main class="login">
    <form class="login__card" id="reset-form" novalidate>
      <p class="eyebrow">Pilates equipment</p>
      <h1>New <em>password</em></h1>
      <label class="field"><span>New password (at least 8 characters)</span><input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <label class="field"><span>Repeat new password</span><input type="password" name="again" autocomplete="new-password" required></label>
      <p class="login__err" id="msg" role="alert"></p>
      <button class="btn" type="submit">Save new password</button>
      <a class="login__back" href="index.html">← Back to the shop</a>
    </form>
  </main>
  <script>
    (() => {
      const form = document.getElementById('reset-form'), msg = document.getElementById('msg');
      const token = new URLSearchParams(location.search).get('token');
      if (!token) msg.textContent = 'This link is incomplete. Ask for a new one from “Forgot password?” in the sign-in window.';
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const password = form.password.value;
        if (password.length < 8) { msg.textContent = 'Use at least 8 characters.'; return; }
        if (password !== form.again.value) { msg.textContent = 'The two passwords do not match.'; return; }
        form.querySelector('button').disabled = true;
        try {
          const res = await fetch('/api/auth/reset', {
            method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error);
          msg.style.color = 'inherit';
          msg.textContent = 'Password changed. You are signed in — taking you to the shop…';
          setTimeout(() => { location.href = 'index.html'; }, 1500);
        } catch (err) {
          msg.textContent = err.message || 'Something went wrong. Please try again.';
          form.querySelector('button').disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
